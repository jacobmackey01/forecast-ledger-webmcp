name: WebMCP workspace

on:
  push:
    branches: [main, webmcp-challenge]
  pull_request:

permissions:
  contents: read

jobs:
  reviewed-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild reviewed snapshot
        env:
          PYTHONPATH: src
        run: cp web/src/data.json /tmp/forecast-ledger.json && python -m de_power_live.webmcp_export --output /tmp/forecast-ledger.json
      - name: Verify committed snapshot
        run: cmp /tmp/forecast-ledger.json web/src/data.json
      - name: Run focused record tests
        env:
          PYTHONPATH: src
        run: python -m pip install pytest==8.4.2 && python -m pytest tests/test_webmcp_export.py tests/test_track_record.py tests/test_audit.py

  browser-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
